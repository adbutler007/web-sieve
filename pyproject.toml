[project]
name = "web-sieve"
version = "0.1.0"
description = "MCP server that fetches web pages as markdown, caches them, and finds the relevant line ranges with Jev."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]<2",
]

# Run the tests with `uv run --frozen pytest -q`. --frozen installs exactly what uv.lock records and
# never rewrites it. Without it, uv rewrites uv.lock whenever an exclude-newer cutoff set in the
# environment (UV_EXCLUDE_NEWER) has moved, even when no dependency changed.
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
